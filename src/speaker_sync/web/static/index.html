<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speaker Sync Calibrator</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --ink: #16181d;
    --muted: #666d7a;
    --line: #e2e5ea;
    --accent: #2f6df6;
    --accent-ink: #ffffff;
    --good: #1a8a52;
    --warn: #b26a00;
    --bad: #c0392b;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1c1f25;
      --ink: #e8eaed;
      --muted: #9aa3b0;
      --line: #2b3038;
      --accent: #6f9bff;
      --accent-ink: #0d1220;
      --good: #47c78a;
      --warn: #e0a33a;
      --bad: #ef6f60;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 640px; margin: 0 auto; }
  a { color: var(--accent); }

  h1 { font-size: 19px; margin: 0; }
  h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600;
       text-transform: uppercase; letter-spacing: .04em; }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }
  .sub.bad { color: var(--bad); }
  header { margin: 2px 2px 14px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .cardhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .cardhead h2 { margin-bottom: 8px; }

  button {
    font: inherit;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border: 0;
    border-radius: 11px;
    padding: 13px 18px;
    width: 100%;
    cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--line);
    font-weight: 500;
    padding: 10px 14px;
  }
  button.small { width: auto; padding: 7px 13px; font-size: 14px; flex: none; }
  .iconbtn {
    width: auto; padding: 4px 10px; background: none; border: 1px solid var(--line);
    border-radius: 20px; color: var(--muted); font-size: 12px; font-weight: 500;
  }

  /* --- status ---------------------------------------------------------- */
  .status { display: flex; align-items: flex-start; gap: 10px; min-height: 22px; }
  #status { white-space: pre-line; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted);
         flex: none; margin-top: 6px; }
  .dot.live { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  .dot.ok { background: var(--good); }
  .dot.err { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .3; } }
  .bar { height: 4px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 12px 0 4px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }

  /* --- steps ----------------------------------------------------------- */
  .steps { list-style: none; margin: 14px 0 0; padding: 0; counter-reset: step; }
  .steps li {
    counter-increment: step;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-top: 1px solid var(--line);
  }
  .steps li::before {
    content: counter(step);
    width: 26px; height: 26px; flex: none; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 700; color: var(--muted); border: 1px solid var(--line);
  }
  .steps li.main::before { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .step-text { flex: 1; min-width: 0; }
  .step-text b { display: block; font-weight: 600; }
  .steps li.main { flex-wrap: wrap; }
  .steps li.main button { flex: 1 1 100%; margin-top: 4px; }
  .quick { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }

  /* --- details on request ---------------------------------------------- */
  details > summary {
    cursor: pointer; color: var(--muted); font-size: 13px; list-style: none;
    padding: 8px 0 2px; user-select: none;
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "▸ "; }
  details[open] > summary::before { content: "▾ "; }
  .more { margin-top: 6px; border-top: 1px solid var(--line); }
  .more-body > * + * { margin-top: 10px; }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }

  .setting { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .setting label { font-size: 14px; }
  .setting input {
    width: 72px; font: inherit; text-align: right;
    color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
    font-variant-numeric: tabular-nums;
  }
  .setting .sub { flex: 1 1 100%; }

  /* --- live view and questions ----------------------------------------- */
  .live { margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
  .liverow { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; }
  .meter { position: relative; height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
  .meter > i { display: block; height: 100%; width: 0; background: var(--good); transition: width .08s linear; }
  .meter > i.quiet { background: var(--warn); }
  .meter > i.clip { background: var(--bad); }
  .meter > b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); left: 0; }
  #live-tally { margin-top: 8px; }
  #live-tally td { font-size: 13px; }
  .human { flex-direction: column; align-items: flex-start; }
  .human > span:last-child { display: flex; gap: 8px; flex-wrap: wrap; }
  .human .iconbtn { font-size: 13px; padding: 6px 12px; }
  #ask { border-color: var(--accent); }
  .askq { font-size: 17px; font-weight: 600; margin: 0 0 12px; }
  .askrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .askrow button { flex: 1 1 140px; margin: 0; }
  .volrow { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
  .volrow input { flex: 1; accent-color: var(--accent); height: 28px; }
  .volrow b { min-width: 3.2em; text-align: right; font-size: 17px; }
  #ask .link { margin: 10px 0 0; padding: 4px 0; }

  /* --- pills, tables ----------------------------------------------------- */
  .pill {
    display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 20px;
    background: var(--line); color: var(--muted); white-space: nowrap;
  }
  .pill.on { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
  .pill.off { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .pill.ref { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: right; padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  td .sub { display: block; font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }
  caption { caption-side: bottom; text-align: left; padding-top: 6px; }

  /* --- speakers ---------------------------------------------------------- */
  .spk { list-style: none; margin: 0; padding: 0; }
  .spk li { padding: 10px 0; border-top: 1px solid var(--line); }
  .spk li:first-child { border-top: 0; }
  .spk-main { display: flex; align-items: center; gap: 10px; }
  .spk-name { flex: 1; min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
  .spk li.off .spk-name { color: var(--muted); }
  .spk-info { font-size: 13px; color: var(--muted); }
  .spk-info > summary { padding: 2px 0 0; font-size: 12px; }
  .spk-info p { margin: 4px 0 0; overflow-wrap: anywhere; }

  /* The manual on/off switch. */
  .switch {
    position: relative; width: 44px; height: 26px; flex: none; padding: 0;
    border-radius: 13px; background: var(--line); border: 0;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: #fff; transition: left .15s ease;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
  .switch[aria-checked="true"] { background: var(--good); }
  .switch[aria-checked="true"]::after { left: 21px; }

  /* --- results ----------------------------------------------------------- */
  .verdict { display: flex; gap: 10px; align-items: flex-start; font-size: 17px; font-weight: 600; margin: 0; }
  .verdict .mark { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid;
                   place-items: center; font-size: 15px; color: #fff; margin-top: 1px; }
  .verdict.good .mark { background: var(--good); }
  .verdict.warn .mark { background: var(--warn); }
  .verdict.bad .mark { background: var(--bad); }
  .spreadline { margin: 10px 0 0 36px; color: var(--muted); font-size: 14px; }
  .spreadline b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .note {
    font-size: 13px; color: var(--muted);
    border-left: 2px solid var(--line); padding-left: 10px; margin: 10px 0 0;
  }
  .note.bad { border-color: var(--bad); color: var(--bad); }
  .note.warn { border-color: var(--warn); color: var(--warn); }
  .hidden, [hidden] { display: none !important; }

  .saverow { display: flex; gap: 8px; margin-top: 14px; }
  .saverow input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  .saverow button { width: auto; flex: none; }

  td.actions { white-space: nowrap; }
  td.actions button { width: auto; margin: 0 0 0 6px; padding: 6px 12px; font-size: 13px; font-weight: 500; }
  .link {
    background: none; border: 0; color: var(--muted);
    padding: 6px 4px; width: auto; margin: 0 0 0 6px;
    font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .link:hover { color: var(--bad); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Speaker Sync Calibrator</h1>
    <p class="sub" data-i18n="tagline"></p>
  </header>
  <p class="note bad" id="insecure" style="margin:0 0 14px" data-i18n="needs_https" hidden></p>
  <p class="sub" id="popout" style="margin:0 0 14px" hidden>
    <span data-i18n="popout_text"></span>
    <a href="." target="_blank" rel="noopener" data-i18n="popout_link"></a>.
  </p>

  <!-- What to do, in order. Everything else is one tap away under "More". -->
  <section class="card" id="run-card">
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status" data-i18n="idle"></span>
    </div>
    <div class="bar"><i id="bar"></i></div>

    <div class="live" id="ask" hidden>
      <p id="ask-question" class="askq"></p>
      <div class="volrow" id="ask-volume" hidden>
        <input id="ask-slider" type="range" min="0" max="100" step="1">
        <b id="ask-value" class="num">—</b>
      </div>
      <div class="askrow">
        <button id="ask-yes"></button>
        <button id="ask-no" class="secondary"></button>
      </div>
      <button id="ask-reset" class="link" hidden data-i18n="ask_reset"></button>
    </div>

    <div class="live" id="live" hidden>
      <div class="meter" title="dBFS"><i id="meter-fill"></i><b id="meter-peak"></b></div>
      <div class="liverow">
        <span class="sub" data-i18n="mic_level"></span>
        <span id="meter-text" class="num">—</span>
      </div>
      <div class="liverow">
        <span class="sub" data-i18n="now_playing"></span>
        <b id="live-playing">—</b>
      </div>
      <div class="liverow">
        <span class="sub" data-i18n="mic_hears"></span>
        <span id="live-heard" class="pill">—</span>
      </div>
      <table id="live-tally"></table>
      <div class="liverow human" id="human" hidden>
        <span class="sub" data-i18n="human_question"></span>
        <span>
          <button class="iconbtn" id="human-ok" data-i18n="human_ok"></button>
          <button class="iconbtn" id="human-wrong" data-i18n="human_wrong"></button>
        </span>
      </div>
    </div>

    <ol class="steps">
      <li>
        <div class="step-text"><b data-i18n="step_mic"></b><span class="sub" data-i18n="step_mic_hint"></span></div>
        <button id="mictest" class="secondary small" data-i18n="mic_test"></button>
      </li>
      <li>
        <div class="step-text"><b data-i18n="step_test"></b><span class="sub" data-i18n="step_test_hint"></span></div>
        <button id="speakertest" class="secondary small" data-i18n="speaker_test_short"></button>
      </li>
      <li>
        <div class="step-text"><b data-i18n="step_volume"></b><span class="sub" data-i18n="step_volume_hint"></span></div>
        <button id="volumestep" class="secondary small" data-i18n="volume_short"></button>
      </li>
      <li class="main">
        <div class="step-text"><b data-i18n="step_run"></b><span class="sub" data-i18n="step_run_hint"></span></div>
        <button id="run" data-i18n="run"></button>
      </li>
    </ol>

    <div class="quick">
      <div class="step-text"><b data-i18n="quick_title"></b><span class="sub" data-i18n="quick_hint"></span></div>
      <button id="synctest" class="secondary small" data-i18n="quick_button"></button>
    </div>

    <details class="more" id="more">
      <summary data-i18n="more"></summary>
      <div class="more-body">
        <div>
          <button id="check" class="secondary" data-i18n="check"></button>
          <p class="hint" data-i18n="check_note"></p>
        </div>
        <div>
          <button id="listen" class="secondary" data-i18n="listen"></button>
          <p class="hint" data-i18n="listen_note"></p>
        </div>
        <div class="setting">
          <label for="chirps" data-i18n="chirps_label"></label>
          <input id="chirps" type="number" min="3" max="40" step="1" inputmode="numeric">
          <span class="sub" id="chirps-note">&nbsp;</span>
        </div>
        <p class="hint" data-i18n="speaker_test_note"></p>
        <p class="hint" data-i18n="run_note"></p>
      </div>
    </details>
  </section>

  <section class="card hidden" id="result">
    <h2 data-i18n="result"></h2>
    <p class="verdict" id="result-verdict"></p>
    <p class="spreadline" id="result-spread">
      <span data-i18n="spread_label"></span>
      <b id="before">—</b> → <b id="after">—</b> <span data-i18n="ms"></span>
    </p>
    <details id="result-notes-box">
      <summary id="result-notes-summary"></summary>
      <div id="notes"></div>
    </details>
    <details id="result-table-box">
      <summary data-i18n="per_speaker"></summary>
      <table id="corrections"></table>
    </details>
    <div class="saverow" id="save-row">
      <input id="save-name" type="text" data-i18n-placeholder="save_placeholder"
             autocomplete="off" maxlength="60">
      <button id="save" class="secondary" data-i18n="save"></button>
    </div>
  </section>

  <section class="card hidden" id="check-result">
    <h2 id="check-title" data-i18n="check_result"></h2>
    <p class="verdict" id="check-verdict"></p>
    <details id="check-notes-box">
      <summary id="check-notes-summary"></summary>
      <div id="check-notes"></div>
    </details>
    <details id="check-table-box">
      <summary data-i18n="per_speaker"></summary>
      <p class="sub" style="margin-top:6px"><span data-i18n="spread_label"></span>
        <b id="check-spread">—</b> <span data-i18n="ms"></span></p>
      <table id="check-table" style="margin-top:6px"></table>
    </details>
  </section>

  <section class="card">
    <div class="cardhead">
      <h2 data-i18n="speakers"></h2>
      <button id="refresh" class="iconbtn" data-i18n="refresh"></button>
    </div>
    <ul class="spk" id="players"><li class="sub" data-i18n="loading"></li></ul>
    <details id="unused-box" hidden>
      <summary id="unused-summary"></summary>
      <ul class="spk" id="unused"></ul>
    </details>
    <details>
      <summary data-i18n="about_switch"></summary>
      <p class="hint" data-i18n="switch_note"></p>
    </details>
  </section>

  <section class="card" id="profiles-card">
    <h2 data-i18n="positions"></h2>
    <table id="profiles"></table>
    <details>
      <summary data-i18n="about_positions"></summary>
      <p class="hint" data-i18n="positions_note"></p>
    </details>
  </section>
</main>
<script src="static/app.js"></script>
</body>
</html>
